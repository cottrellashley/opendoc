site:
  name: "OpenDoc Example"
  url: "https://example.com"
  description: "An example site showcasing OpenDoc features"
  author: ""

content:
  dir: "content"

build:
  output_dir: "dist"

collections:
  writing:
    sort: "newest_first"
    date_format: "%B %d, %Y"
    items_per_page: 10
    tags: true
    archive: true
    layout: "timeline"

nav:
  - Home: index.md
  - Features: features.md
  - Settings Guide: settings-guide.md
  - Writing: writing/

theme:
  name: "default"
